[storage]
db_path = "naga.db"   # SQLite 数据库文件路径（相对于项目根目录）

[model]
default = "qwen3.6-flash"
available = ["qwen3.6-flash","qwen3.6-flash-2026-04-16", "qwen3.6-plus", "qwen3.6-max-preview"]
base_url = ""  # 留空使用 OpenAI 官方地址，填入第三方兼容服务 URL，如 https://dashscope.aliyuncs.com/compatible-mode/v1

# 费用等级标记：low / medium / high
# 同一 tier 有多个模型时，available 列表中靠后的优先
[model.tiers]
"qwen3.6-flash"            = "low"
"qwen3.6-flash-2026-04-16" = "low"
"qwen3.6-plus"             = "medium"
"qwen3.6-max-preview"      = "high"

# 模型专属扩展参数，注入 API 请求的 extra_body（仅部分供应商支持）
# 示例：为 Qwen3 系列配置思维链参数
[model.extra_params."qwen3.6-flash"]
enable_thinking = true
thinking_budget = 4000

[model.extra_params."qwen3.6-flash-2026-04-16"]
enable_thinking = true
thinking_budget = 4000

[model.extra_params."qwen3.6-plus"]
enable_thinking = true
thinking_budget = 4000

[model.extra_params."qwen3.6-max-preview"]
enable_thinking = true
thinking_budget = 4000

[routing]
enabled = true
classifier_model = "qwen3.6-flash"
show_routing_decision = true

# 路由结果映射到费用等级（low/medium/high），不绑定具体模型名
[routing.model_map]
simple  = "low"
medium  = "medium"
complex = "high"

# 单价：元/百万token（人民币，中国内地站），仅用于本地费用估算
[pricing]
"qwen3.6-flash"            = { input = 1,  output = 6  }
"qwen3.6-flash-2026-04-16" = { input = 1,  output = 6  }
"qwen3.6-plus"             = { input = 2,  output = 12 }
"qwen3.6-max-preview"      = { input = 9,  output = 54 }

[tools]
command_timeout = 30       # execute_command 超时秒数
output_max_chars = 3000    # 工具返回结果最大字符数
tool_max_rounds = 30       # 单次对话最大工具调用轮次（防死循环）
tool_max_errors = 3        # 连续工具错误上限（防错误风暴）
replan_threshold = 0.6     # 信号B：step 轮次消耗比超此值触发 re-planner
replan_repeat_window = 3   # 信号C：重复检测滑动窗口大小

[agent]
max_history = 50
auto_confirm = true
scripts_subdir = "generated_scripts"
temperature = 0.7
top_p = 0.8
show_thinking = true
enable_search = false  # 已锁死，独立计费禁止使用，请勿修改
prompt_prefix = "雯雯在听"
system_prompt_file = "generated_scripts/my_personality_prompt.txt"
context_token_limit = 0           # 0 = 自动检测模型上下文窗口，非零时强制覆盖
compress_threshold = 0.60         # 超过上下文窗口的 60% 时触发压缩管线
tool_output_max_chars = 300       # 旧轮次工具输出最大保留字符数

[search]
max_results = 10        # 单次搜索返回最大条数
timeout = 10           # 请求超时秒数
freshness = "noLimit"  # 时效过滤：oneDay/oneWeek/oneMonth/noLimit

[skills]
# 激活的 skill 名称列表（对应 skills/*.md 文件的 name 字段）
# 空列表时，由各文件自身 frontmatter 中的 enabled 字段决定
enabled = []

# ── 记忆系统配置 ────────────────────────────────────────────────────────────
[memory]
# 向量库后端：chroma（默认，内嵌）/ qdrant
backend = "chroma"
# 每 N 轮对话后触发一次记忆提取；0 = 仅会话结束时触发
extract_every_n_turns = 3
# 触发提取的最小内容字符数（避免短消息浪费）
min_content_length = 20
# Layer2 情节记忆语义检索返回条数
episodic_top_k = 3
# Layer1 核心记忆全量注入 system prompt 的最大条数
core_max_items = 20
# mem0 内部提取记忆时使用的 LLM（需与 [model].base_url 接入点兼容）
llm_model = "qwen3.6-flash"

[memory.embedder]
# 嵌入模型供应商：openai / ollama
provider = "openai"
model = "text-embedding-v2"   # DashScope 兼容模型，维度 1536，与 text-embedding-3-small 相同
# 留空则继承 [model].base_url
base_url = ""

# Chroma 配置（内嵌或独立部署二选一）
[memory.chroma]
# mode: local（内嵌，无需独立服务）/ server（独立部署）
mode = "local"
path = "./chroma_db"   # mode=local 时有效
host = "localhost"     # mode=server 时有效
port = 8000

# Qdrant 配置（内嵌或独立部署二选一）
[memory.qdrant]
# mode: local（内嵌文件）/ server（独立部署）
mode = "local"
path = "./qdrant_db"   # mode=local 时有效
host = "localhost"     # mode=server 时有效
port = 6333

# Redis 向量索引配置（复用 [redis] 连接，需 RedisStack / Redis 7.2+）
[memory.redis_vector]
index_name = "naga_memories"
vector_dim = 1536
