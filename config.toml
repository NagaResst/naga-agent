[storage]
db_path = "naga.db"   # SQLite 数据库文件路径（相对于项目根目录）

[model]
default = "GLM-5.3"
available = ["GLM-5.3"]
base_url = ""


[delegation]
enabled = true
model = "DeepSeek-V4.1-Flash"              # 低成本子模型名；也可设置 SUBAGENT_MODEL
max_tasks = 3            # 单次调用最多分派几个独立任务
max_rounds = 3           # 每个子 Agent 最多调用几轮只读工具
max_calls = 2            # 单轮主对话最多分派几次
context_token_limit = 0 # 子模型窗口；0=按元数据自动探测

[tools]
command_timeout = 30       # execute_command 超时秒数
output_max_chars = 3000    # 工具返回结果最大字符数
tool_max_rounds = 90       # 单次对话最大工具调用轮次（防死循环）
tool_max_errors = 3        # 连续工具错误上限（防错误风暴）

[agent]
max_history = 50           # 发送给模型的最多历史消息数；按完整对话轮次裁剪
auto_confirm = true
scripts_subdir = "generated_scripts"
temperature = 0.7
top_p = 0.9
show_thinking = true
enable_search = false  # 已锁死，独立计费禁止使用，请勿修改
prompt_prefix = "你"
system_prompt_file = "generated_scripts/my_personality_prompt.txt"
context_token_limit = 0           # 0 = 自动检测模型上下文窗口，非零时强制覆盖
context_compact_ratio = 0.75      # 已用输入达到此比例时归档完整旧轮次
tool_result_keep_rounds = 30       # 历史工具结果保留上限；当前用户轮次全部保留（仍受上下文窗口约束）
runtime_state_max_chars = 1800    # 运行参考状态的最大字符数
runtime_tool_events_max_items = 6 # 运行状态中最多保留多少条最近工具动作
runtime_findings_max_items = 6    # 运行状态中最多保留多少条最近已验证结果
runtime_read_skill_files_max_items = 8 # 运行状态中最多保留多少条已读取 skill 资源
runtime_working_set_max_items = 8
runtime_completed_steps_max_items = 8
skill_layer_mode = "auto"

[mcp]
timeout = 20           # 单次 MCP 请求超时秒数
output_max_chars = 16000

# 按需配置 stdio MCP server；配置后主 Agent 才会看到 mcp 工具。
# [mcp.servers.example]
# command = "npx"
# args = ["-y", "@your-org/your-mcp-server"]
# cwd = "/path/to/workspace"  # 可选；默认继承当前工作目录
# [mcp.servers.example.env]
# EXAMPLE_TOKEN = "${EXAMPLE_TOKEN}"  # 敏感值请从环境变量读取

[mcp.servers.anysearch]
url = "https://api.anysearch.com/mcp"
connect_timeout = 60
enabled = true

[mcp.servers.anysearch.headers]
Authorization = "Bearer ${ANYSEARCH_API_KEY}"
X-Anysearch-Client = "mcp/1.0.0"

[skills]
# 激活的 skill 名称列表（对应 skills/*.md 文件的 name 字段）
# 空列表时，由各文件自身 frontmatter 中的 enabled 字段决定
enabled = []

# ── 记忆系统配置 ────────────────────────────────────────────────────────────
[memory]
# 向量库后端
backend = "qdrant"
agent_id = "naga-agent"  # mem0 情景记忆跨会话共享的归属 ID，修改后旧作用域不可见
# Layer1 核心记忆
core_max_items = 20
core_max_chars = 200
# Layer2 情景记忆 — 自动提取
extract_every_n_turns = 10   # 0=不启用
extract_history_turns = 20
# 检索
episodic_search_k = 15
episodic_inject_k = 5
# mem0 内部提取使用的 LLM
llm_model = "DeepSeek-V4.1-Flash"

[memory.embedder]
model = "Qwen3-Embedding-8B"
base_url = "https://api-opensource-ai.mde.rakuten-it.com/v1"
# VECTOR_API_KEY 环境变量优先；未设置时复用主模型 OPENAI_API_KEY。

[memory.reranker]
model = "Qwen3-Reranker-8B"
base_url = "https://api-opensource-ai.mde.rakuten-it.com/v1"
timeout = 10

[memory.qdrant]
host = "localhost"
port = 6333
embedding_dims = 4096
collection_name = "mem0_qwen3_embedding_8b"  # 与旧的 768 维 mem0 集合隔离

# ── 本地嵌入 Daemon ─────────────────────────────────────────────────────────
[embedding_daemon]
# Daemon 脚本路径（启动时自动 fork 子进程）
script_path = ""  # 使用远程 Embedding，不启动本地模型下载
host = "127.0.0.1"
port = 8000
# CPU 计算线程数（0 = 自动检测全部核心，默认 PyTorch 只用一半）
cpu_threads = 0
